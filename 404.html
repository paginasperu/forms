<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f4f5f7">
  <title>Esta página no está disponible | OFICIAL</title>
  <meta name="description" content="La página que buscas no está disponible. Vuelve al formulario BTL de OFICIAL.">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #17191f;
      background: #f4f5f7;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }
    .brand-wordmark { display: block; width: 70px; height: auto; }
    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }
    main {
      display: flex;
      width: min(100%, 440px);
      min-height: 390px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 36px;
      border: 1px solid #e1e4e9;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(25 35 50 / 5%);
      text-align: center;
    }
    .brand-window { width: auto; margin-bottom: 32px; }
    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 32px);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.18;
    }
    p {
      max-width: 310px;
      margin: 14px 0 0;
      color: #626b78;
      font-size: 16px;
      line-height: 1.55;
    }
    .action {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      padding: 12px 22px;
      border-radius: 9px;
      background: #0757ed;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      text-decoration: none;
      transition: background-color .15s ease, transform .15s ease;
    }
    .action:hover { background: #0648c7; }
    .action:active { transform: translateY(1px); }
    .action:focus-visible { outline: 3px solid #172033; outline-offset: 3px; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      main { min-height: 360px; padding: 40px 24px; }
      .brand-window { margin-bottom: 26px; }
      .brand-wordmark { width: 64px; }
      .action { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .action { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand-window"><img class="brand-wordmark" src="/btl/assets/oficial.svg" width="70" height="20" alt="OFICIAL"></div>
    <h1>Esta página no está disponible</h1>
    <p>Revisa el enlace o vuelve al formulario</p>
    <a class="action" href="/btl/">Ir al formulario BTL</a>
  </main>
</body>
</html>
