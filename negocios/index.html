<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Registro de negocios | OFICIAL</title><link rel="stylesheet" href="../postulantes/styles.css"><link rel="stylesheet" href="styles.css"><script src="validation.js?v=20261121" defer></script><script src="app.js?v=20261121-validacion" defer></script></head>
<body><header class="topbar"><a class="brand" href="./" aria-label="OFICIAL, registro de negocios"><img src="../postulantes/assets/oficial.svg" width="70" height="20" alt="OFICIAL"></a></header>
<main class="page-shell"><section class="intro"><h1>Registro de negocios</h1></section><p class="required-key">Todos los campos son obligatorios, excepto los marcados como «Opcional»</p>
<form class="application" id="business-form" novalidate>
<section class="application-section"><h2 class="section-title">Lugar</h2>
<div id="location-summary" hidden><div class="location-line"><strong id="location-display"></strong><button class="text-button" type="button" id="change-location">Cambiar</button></div></div>
<div id="location-editor"><div class="business-grid"><label class="text-field">Tipo de lugar<select id="tipo-lugar"><option value="">Selecciona el tipo</option><option>Mercado</option><option>Galería</option><option>Centro comercial</option><option>Feria</option></select></label><label class="text-field">Nombre del lugar<input id="lugar" maxlength="160" autocomplete="off"></label></div><p class="field-hint field-error" id="location-error" hidden></p><div class="location-buttons"><button type="button" class="secondary-button" id="save-location">Guardar lugar</button><button type="button" class="text-button" id="cancel-location" hidden>Cancelar</button></div></div></section>
<fieldset id="business-details" class="application-details" disabled hidden>

<section class="application-section"><h2 class="section-title">Ubicación del negocio</h2><div class="business-grid three"><label class="text-field">Piso<input name="piso" maxlength="3" inputmode="numeric" pattern="[0-9]{1,3}" required><small class="prefilled-badge" id="prefilled-piso" hidden>Prellenado</small></label><label class="text-field">Sección<input name="seccion" maxlength="80" required><small class="prefilled-badge" id="prefilled-seccion" hidden>Prellenado</small></label><label class="text-field"><span>Pasillo <span class="optional">Opcional</span></span><input name="pasillo" maxlength="20"><small class="prefilled-badge" id="prefilled-pasillo" hidden>Prellenado</small></label></div></section>
<section class="application-section"><h2 class="section-title">Datos del negocio</h2><div class="business-grid"><label class="text-field">Tipo<input name="tipo" maxlength="80" required></label><label class="text-field">Nombre<input name="nombre" maxlength="120" autocomplete="organization" required></label><label class="text-field">Local<input name="local" maxlength="20" required></label></div></section>
<section class="application-section"><h2 class="section-title">Contacto</h2><div class="business-grid"><label class="text-field"><span>WhatsApp <span class="optional">Opcional</span></span><input name="whatsapp" type="tel" inputmode="numeric" autocomplete="tel-national"></label><label class="text-field"><span>Red social <span class="optional">Opcional</span></span><input name="red_social" type="url" maxlength="2048"></label></div></section>
<section class="application-section"><button class="submit-button" type="submit">Guardar registro</button></section>
</fieldset><p id="location-prompt" class="modality-prompt">Guarda el lugar para comenzar a registrar negocios</p><p id="form-status" class="form-status" role="status" aria-live="polite" hidden></p></form>
</main></body></html>
